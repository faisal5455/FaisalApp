name: Build Android APK

on:
  push:
    branches: [ main, master, 'app-*' ]
  pull_request:
  workflow_dispatch:

# Allow the workflow's GITHUB_TOKEN to create releases / upload assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Always keep the artifact (handy for PRs / main builds).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # For builder-triggered branches (app-*), publish the APK as a Release
      # asset so the builder app can fetch a stable, public download URL.
      - name: Publish APK as Release
        if: startsWith(github.ref_name, 'app-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Automated build from the web2app builder for branch ${{ github.ref_name }} (commit ${{ github.sha }})."
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: "false"
