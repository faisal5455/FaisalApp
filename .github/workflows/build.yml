name: Build Android APK

on:
  push:
    branches: [ main, master, 'app-*' ]
  pull_request:
  workflow_dispatch:

# Allow the workflow's GITHUB_TOKEN to create releases / upload assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      # Always keep the artifact (handy for PRs / main builds).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # If the build branch was deleted while this run was building (the user
      # deleted the project), skip publishing so we don't re-create the release.
      - name: Check build branch still exists
        id: branch_check
        if: startsWith(github.ref_name, 'app-')
        run: |
          if git ls-remote --exit-code --heads origin "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Branch ${{ github.ref_name }} was deleted; skipping release."
          fi

      # For builder-triggered branches (app-*), publish the APK as a Release
      # asset so the builder app can fetch a stable, public download URL.
      - name: Publish APK as Release
        if: startsWith(github.ref_name, 'app-') && steps.branch_check.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Automated build from the web2app builder for branch ${{ github.ref_name }} (commit ${{ github.sha }})."
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: "false"
